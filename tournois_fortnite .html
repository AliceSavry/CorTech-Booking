<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Manager - Tournoi Battle Royale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Polices Fortnite Style -->
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Teko:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- THEME FORTNITE BATTLE ROYALE (MODE TV) --- */
        .fn-tv-mode {
            font-family: 'Teko', sans-serif;
            background-color: #1a0b2e; /* Violet foncé tempête */
            overflow: hidden;
            position: relative;
        }

        .fn-title-font {
            font-family: 'Luckiest Guy', cursive;
            letter-spacing: 2px;
        }

        /* Fond de la tempête (Storm Background) */
        .fn-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #2b1055 0%, #110022 100%);
            z-index: 0;
        }
        
        .fn-storm-effect {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.015' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            opacity: 0.3;
            mix-blend-mode: overlay;
            z-index: 1;
            animation: storm-move 10s linear infinite alternate;
        }

        @keyframes storm-move {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-10px, -10px); }
        }

        /* Cartes de Classement type "Rareté" Fortnite */
        .fn-card {
            position: relative;
            background: rgba(30, 20, 50, 0.85);
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            margin: 10px 0;
            border-radius: 8px;
            border-left: 8px solid transparent;
            transform: skewX(-5deg);
            transition: transform 0.3s ease;
        }
        
        /* Légendaire (Or) */
        .fn-card-1st { background: linear-gradient(135deg, rgba(255, 170, 0, 0.9), rgba(255, 100, 0, 0.9)); border-left-color: #FFF; color: #111; }
        /* Épique (Violet) */
        .fn-card-2nd { background: linear-gradient(135deg, rgba(160, 50, 255, 0.9), rgba(100, 20, 200, 0.9)); border-left-color: #E2FF00; color: #FFF; }
        /* Rare (Bleu) */
        .fn-card-3rd { background: linear-gradient(135deg, rgba(0, 150, 255, 0.9), rgba(0, 80, 200, 0.9)); border-left-color: #FFF; color: #FFF; }
        /* Atypique (Vert/Standard) */
        .fn-card-standard { border-left-color: #28B1FF; border-bottom: 2px solid rgba(40, 177, 255, 0.3); color: #FFF; }

        /* Ombre portée pour les textes clairs sur fond sombre */
        .fn-text-outline { 
            text-shadow: 
                -2px -2px 0 rgba(0,0,0,0.8), 
                 2px -2px 0 rgba(0,0,0,0.8), 
                -2px  2px 0 rgba(0,0,0,0.8), 
                 2px  2px 0 rgba(0,0,0,0.8),
                 0px  4px 10px rgba(0,0,0,0.9); 
        }

        /* Effet "Glow" spécifique pour le titre jaune */
        .fn-victory-glow {
            color: #fbef2d;
            text-shadow: 
                0 0 10px rgba(251, 239, 45, 0.5),
                0 0 20px rgba(251, 239, 45, 0.3),
                -3px -3px 0 #000, 
                 3px -3px 0 #000, 
                -3px  3px 0 #000, 
                 3px  3px 0 #000;
        }

        .tv-rank { font-size: clamp(2rem, 4vw, 4rem); font-family: 'Luckiest Guy', cursive; }
        .tv-name { font-size: clamp(1.8rem, 3.5vw, 3.5rem); line-height: 1; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .tv-team { font-size: clamp(1rem, 1.8vw, 1.8rem); font-weight: 400; letter-spacing: 2px; color: #E2FF00; }
        .tv-pts { font-size: clamp(2.5rem, 5vw, 5rem); font-family: 'Luckiest Guy', cursive; line-height: 0.9; }

    </style>
</head>
<body class="bg-slate-100 text-slate-900 h-screen overflow-hidden flex flex-col">

    <div id="mobile-header" class="md:hidden bg-indigo-900 text-white p-4 flex justify-between items-center z-20 relative shadow-md hidden">
        <h1 class="text-xl font-bold fn-title-font tracking-wide flex items-center gap-2">
            <i class="fa-solid fa-parachute-box text-yellow-400"></i> FORTNITE BR
        </h1>
        <button onclick="toggleMobileMenu()" class="text-indigo-300 hover:text-white p-2">
            <i id="mobile-menu-icon" class="fa-solid fa-bars text-2xl"></i>
        </button>
    </div>

    <div id="app" class="flex-1 flex overflow-hidden relative"></div>

    <script>
        // --- CONFIGURATION COMPETITIVE FORTNITE ---
        function getPlacementPoints(pos) {
            if (!pos) return 0;
            if (pos === 1) return 25;
            if (pos === 2) return 20;
            if (pos === 3) return 16;
            if (pos === 4) return 14;
            if (pos === 5) return 13;
            if (pos <= 10) return 10;
            if (pos <= 20) return 7;
            if (pos <= 30) return 5;
            if (pos <= 50) return 3;
            if (pos <= 75) return 1;
            return 0;
        }

        function getElimPoints(elims) {
            return (elims || 0) * 1;
        }

        let isTVMode = new URLSearchParams(window.location.search).get('tv') === 'true';
        try {
            if (localStorage.getItem('fn_spawn_tv') === 'true') {
                isTVMode = true;
                localStorage.removeItem('fn_spawn_tv');
                sessionStorage.setItem('fn_is_tv_window', 'true');
            } else if (sessionStorage.getItem('fn_is_tv_window') === 'true') {
                isTVMode = true;
            }
        } catch(e) {}

        let defaultState = {
            activeTab: 'dashboard', mobileMenuOpen: false, isTVWindow: isTVMode,
            players: [
                { id: 'p1', pseudo: 'Ninja', team: 'Blue' }, { id: 'p2', pseudo: 'Bugha', team: 'Red' },
                { id: 'p3', pseudo: 'Mongraal', team: 'Solo' }, { id: 'p4', pseudo: 'SypherPK', team: 'Blue' },
                { id: 'p5', pseudo: 'Clix', team: 'Solo' }, { id: 'p6', pseudo: 'Benjyfishy', team: 'EU' },
                { id: 'p7', pseudo: 'MrSavage', team: 'EU' }, { id: 'p8', pseudo: 'Tfue', team: 'Red' },
            ],
            matches: [
                {
                    id: 'm1', name: 'Partie 1', status: 'completed', players: ['p1', 'p2', 'p3', 'p4'],
                    results: { 
                        p1: { placement: 1, elims: 6, penalty: 0 }, 
                        p2: { placement: 2, elims: 3, penalty: 0 }, 
                        p3: { placement: 15, elims: 4, penalty: 0 }, 
                        p4: { placement: 50, elims: 0, penalty: 0 } 
                    }
                }
            ],
            editingMatch: null, errorMsg: '', confirmDialog: { isOpen: false }, promptDialog: { isOpen: false }
        };

        let state = { ...defaultState };
        try {
            const savedState = localStorage.getItem('fn_state');
            if (savedState) {
                const parsed = JSON.parse(savedState);
                state.players = parsed.players || state.players;
                state.matches = parsed.matches || state.matches;
            }
        } catch (e) {}

        if (state.isTVWindow) {
            window.addEventListener('storage', (e) => {
                if (e.key === 'fn_state' && e.newValue) {
                    try {
                        const newState = JSON.parse(e.newValue);
                        state.players = newState.players;
                        state.matches = newState.matches;
                        render();
                    } catch (err) {}
                }
            });
        }

        let tvScrollReq = null, tvScrollPos = 0, tvScrollDir = 0.5, tvScrollPause = 180;
        function autoScrollTV() {
            if (!state.isTVWindow) return;
            const container = document.getElementById('tv-scroll-container');
            if (container) {
                if (container.scrollHeight > container.clientHeight) {
                    if (tvScrollPause > 0) tvScrollPause--;
                    else {
                        tvScrollPos += tvScrollDir; container.scrollTop = tvScrollPos;
                        if (tvScrollPos >= (container.scrollHeight - container.clientHeight)) { tvScrollDir = -0.5; tvScrollPause = 200; } 
                        else if (tvScrollPos <= 0) { tvScrollDir = 0.5; tvScrollPause = 200; tvScrollPos = 0; }
                    }
                } else tvScrollPos = 0;
            }
            tvScrollReq = requestAnimationFrame(autoScrollTV);
        }
        if (state.isTVWindow) requestAnimationFrame(autoScrollTV);

        function saveToStorage() {
            if (!state.isTVWindow) try { localStorage.setItem('fn_state', JSON.stringify({ players: state.players, matches: state.matches })); } catch (e) {}
        }

        function getStandings() {
            const scores = {};
            state.players.forEach(p => { scores[p.id] = { ...p, totalPoints: 0, matchesPlayed: 0, wins: 0, totalElims: 0 }; });
            
            state.matches.filter(m => m.status === 'completed').forEach(match => {
                match.players.forEach(playerId => {
                    if (!scores[playerId] || !match.results[playerId]) return;
                    const data = match.results[playerId];
                    const pos = parseInt(data.placement);
                    const elims = parseInt(data.elims) || 0;
                    let matchPoints = getPlacementPoints(pos) + getElimPoints(elims);
                    if (pos === 1) scores[playerId].wins += 1;
                    scores[playerId].totalElims += elims;
                    scores[playerId].totalPoints += matchPoints - (data.penalty || 0);
                    scores[playerId].matchesPlayed += 1;
                });
            });

            return Object.values(scores).sort((a, b) => {
                if (b.totalPoints !== a.totalPoints) return b.totalPoints - a.totalPoints;
                if (b.wins !== a.wins) return b.wins - a.wins;
                return b.totalElims - a.totalElims;
            });
        }

        function setTab(tab) { state.activeTab = tab; state.editingMatch = null; state.mobileMenuOpen = false; render(); }
        function toggleMobileMenu() { state.mobileMenuOpen = !state.mobileMenuOpen; render(); }
        function openTVWindow() {
            saveToStorage(); 
            try { localStorage.setItem('fn_spawn_tv', 'true'); window.open(window.location.href, '_blank', 'width=1280,height=720'); } catch(e) { alert("Erreur d'ouverture"); }
            state.mobileMenuOpen = false; render();
        }

        function showConfirm(title, message, callback) { state.confirmDialog = { isOpen: true, title, message, callback }; render(); }
        function closeConfirm() { state.confirmDialog.isOpen = false; render(); }
        function executeConfirm() { if(state.confirmDialog.callback) state.confirmDialog.callback(); closeConfirm(); }

        function showPrompt(title, message, defaultValue, callback) { state.promptDialog = { isOpen: true, title, message, value: defaultValue, callback }; render(); }
        function closePrompt() { state.promptDialog.isOpen = false; render(); }
        function executePrompt() { if(state.promptDialog.callback) state.promptDialog.callback(state.promptDialog.value); closePrompt(); }
        function updatePromptValue(val) { state.promptDialog.value = val; }

        function addPlayer(event) {
            event.preventDefault();
            const pseudo = document.getElementById('input-pseudo').value.trim();
            const team = document.getElementById('input-team').value.trim();
            if (!pseudo) return;
            state.players.push({ id: `p${Date.now()}`, pseudo, team });
            render();
        }

        function removePlayer(playerId) {
            showConfirm("Supprimer ce joueur ?", "Il sera retiré des matchs.", () => {
                state.players = state.players.filter(p => p.id !== playerId);
                state.matches = state.matches.map(m => {
                    if (m.players.includes(playerId)) {
                        const newPlayers = m.players.filter(id => id !== playerId);
                        const newResults = { ...m.results }; delete newResults[playerId];
                        return { ...m, players: newPlayers, results: newResults };
                    }
                    return m;
                });
                render();
            });
        }

        function createMatch() {
            state.matches.unshift({ id: `m${Date.now()}`, name: `Partie ${state.matches.length + 1}`, status: 'pending', players: [], results: {} });
            state.editingMatch = JSON.parse(JSON.stringify(state.matches[0])); state.errorMsg = ''; render();
        }

        function editMatch(matchId) { state.editingMatch = JSON.parse(JSON.stringify(state.matches.find(m => m.id === matchId))); state.errorMsg = ''; render(); }
        function cancelEditMatch() { state.editingMatch = null; render(); }
        function deleteMatch(matchId) { showConfirm("Supprimer la partie ?", "Définitif ?", () => { state.matches = state.matches.filter(m => m.id !== matchId); state.editingMatch = null; render(); }); }

        function saveMatch() {
            if (state.editingMatch.players.length === 0) { state.errorMsg = "Ajoutez un joueur."; render(); return; }
            state.editingMatch.status = 'completed';
            const index = state.matches.findIndex(m => m.id === state.editingMatch.id);
            if(index !== -1) state.matches[index] = state.editingMatch;
            state.editingMatch = null; render();
        }

        function autoGenerateLobbies() {
            if (state.players.length === 0) return;
            showPrompt("Génération Auto", "Joueurs max par lobby (100 max) ?", "100", (val) => {
                const max = parseInt(val, 10); if (isNaN(max) || max < 2) return;
                const shuffled = [...state.players].sort(() => 0.5 - Math.random());
                const num = Math.ceil(shuffled.length / max);
                const newMatches = Array.from({ length: num }, (_, i) => ({ id: `m${Date.now()}_${i}`, name: `Partie Auto ${i+1}`, status: 'pending', players: [], results: {} }));
                shuffled.forEach((p, i) => { const m = newMatches[i % num]; m.players.push(p.id); m.results[p.id] = { placement: '', elims: 0, penalty: 0 }; });
                state.matches = [...newMatches, ...state.matches]; render();
            });
        }

        function addPlayerToLobby() {
            const playerId = document.getElementById('lobby-player-select').value;
            state.errorMsg = '';
            if (!playerId || state.editingMatch.players.includes(playerId)) return;
            if (state.editingMatch.players.length >= 100) { state.errorMsg = "Lobby complet (100 joueurs max)."; render(); return; }
            state.editingMatch.players.push(playerId); state.editingMatch.results[playerId] = { placement: '', elims: 0, penalty: 0 }; render();
        }

        function addAllPlayersToLobby() {
            state.players.forEach(p => {
                if (!state.editingMatch.players.includes(p.id) && state.editingMatch.players.length < 100) {
                    state.editingMatch.players.push(p.id);
                    state.editingMatch.results[p.id] = { placement: '', elims: 0, penalty: 0 };
                }
            });
            render();
        }

        function removePlayerFromLobby(playerId) {
            state.editingMatch.players = state.editingMatch.players.filter(id => id !== playerId);
            delete state.editingMatch.results[playerId]; render();
        }

        function updatePlacement(playerId, value) {
            const pos = parseInt(value, 10);
            state.editingMatch.results[playerId].placement = isNaN(pos) ? '' : pos; render();
        }

        function updateElims(playerId, value) {
            const elims = parseInt(value, 10);
            state.editingMatch.results[playerId].elims = isNaN(elims) ? 0 : elims; render();
        }

        function updatePenalty(playerId, value) { 
            state.editingMatch.results[playerId].penalty = isNaN(parseInt(value, 10)) ? 0 : parseInt(value, 10); render(); 
        }

        function calculateDraftPoints(playerId) {
            const data = state.editingMatch.results[playerId];
            if (!data) return 0;
            return getPlacementPoints(parseInt(data.placement)) + getElimPoints(parseInt(data.elims)) - (parseInt(data.penalty) || 0);
        }

        function renderSidebar() {
            const navItem = (id, icon, label, isH, onClickStr) => `
                <div onclick="${onClickStr || `setTab('${id}')`}" class="flex items-center gap-3 px-3 py-3 rounded-lg cursor-pointer transition-all font-medium whitespace-nowrap ${state.activeTab === id && !onClickStr ? (isH ? 'bg-indigo-600 text-white shadow-md' : 'bg-violet-600 text-white shadow-md') : (isH ? 'bg-indigo-900/50 text-indigo-300 hover:bg-indigo-600 hover:text-white' : 'text-indigo-200 hover:bg-indigo-800 hover:text-white')}">
                    <i class="${icon} w-5 text-center"></i><span>${label}</span>
                </div>`;
            return `
                <div onclick="toggleMobileMenu()" class="fixed inset-0 bg-indigo-900/60 backdrop-blur-sm z-30 md:hidden ${state.mobileMenuOpen ? 'block' : 'hidden'}"></div>
                <aside class="w-64 bg-indigo-950 text-white flex flex-col shadow-xl z-40 h-full fixed md:relative transform ${state.mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 transition-transform duration-300">
                    <div class="p-6 hidden md:block"><h1 class="text-3xl fn-title-font tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-200 flex items-center gap-2"><i class="fa-solid fa-crosshairs text-yellow-400"></i> FORTNITE</h1><p class="text-[10px] text-indigo-300 mt-1 uppercase font-bold tracking-widest">Tournament Manager</p></div>
                    <nav class="flex-1 px-4 py-4 space-y-2">
                        ${navItem('dashboard', 'fa-solid fa-ranking-star', 'Classement Général')}
                        ${navItem('matches', 'fa-solid fa-parachute-box', 'Parties (Lobbys)')}
                        ${navItem('players', 'fa-solid fa-users', 'Joueurs Inscrits')}
                        <div class="pt-6 pb-2"><p class="px-3 text-[10px] font-bold text-indigo-400 uppercase tracking-wider">Affichage Public</p></div>
                        ${navItem('tv', 'fa-solid fa-tv', 'TV Mode (Aperçu)', true)}
                        ${navItem('tv-window', 'fa-solid fa-external-link-alt', 'TV Mode (Fenêtre)', true, 'openTVWindow()')}
                    </nav>
                </aside>`;
        }

        function renderDashboard() {
            const st = getStandings();
            let rows = st.map((p, i) => `
                <tr class="hover:bg-slate-50">
                    <td class="p-4 text-center font-bold text-slate-500">${i===0?'<span class="text-yellow-500 text-xl"><i class="fa-solid fa-crown"></i> 1</span>':i===1?'<span class="text-purple-500 text-xl"><i class="fa-solid fa-medal"></i> 2</span>':i===2?'<span class="text-blue-500 text-xl"><i class="fa-solid fa-medal"></i> 3</span>':i+1}</td>
                    <td class="p-4"><div class="font-bold text-slate-900">${p.pseudo}</div><div class="text-xs text-slate-500">${p.team || '-'}</div></td>
                    <td class="p-4 text-center text-slate-600">${p.matchesPlayed}</td>
                    <td class="p-4 text-center text-yellow-600 font-bold">${p.wins}</td>
                    <td class="p-4 text-center text-red-500 font-bold">${p.totalElims}</td>
                    <td class="p-4 text-right font-black text-violet-700 text-xl">${p.totalPoints} <span class="text-sm font-normal text-slate-400">pts</span></td>
                </tr>`).join('');
            if(!rows) rows = `<tr><td colspan="6" class="p-8 text-center text-slate-500">Aucun résultat enregistré.</td></tr>`;
            return `<div class="p-8 max-w-5xl mx-auto overflow-y-auto h-full hide-scroll w-full"><header class="mb-8"><h2 class="text-3xl font-bold text-slate-800 tracking-tight">Classement Général</h2><p class="text-sm text-slate-500 mt-1">Barème : Top 1 (25pts) • 1 Kill (1pt)</p></header><div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"><table class="w-full text-left border-collapse"><thead><tr class="bg-slate-50 text-xs font-bold text-slate-500 uppercase tracking-wider"><th class="p-4 text-center">Rang</th><th class="p-4">Joueur</th><th class="p-4 text-center">Parties</th><th class="p-4 text-center text-yellow-600">Top 1</th><th class="p-4 text-center text-red-500">Kills</th><th class="p-4 text-right">Total Pts</th></tr></thead><tbody class="divide-y divide-slate-100">${rows}</tbody></table></div></div>`;
        }

        function renderMatchEditor() {
            const draft = state.editingMatch;
            let opts = `<option value="">Sélectionner un joueur...</option>`;
            state.players.filter(p => !draft.players.includes(p.id)).forEach(p => opts += `<option value="${p.id}">${p.pseudo} (${p.team||'Solo'})</option>`);
            let tb = '';
            if(draft.players.length === 0) tb = `<tr><td colspan="6" class="p-8 text-center text-slate-500">Sélectionnez des joueurs pour cette partie.</td></tr>`;
            else draft.players.forEach(pId => {
                const p = state.players.find(x => x.id === pId) || { pseudo: '?' };
                const res = draft.results[pId] || { placement: '', elims: 0, penalty: 0 };
                tb += `<tr class="hover:bg-slate-50 border-b"><td class="p-3 font-semibold text-slate-800">${p.pseudo}</td><td class="p-2 text-center"><input type="number" min="1" max="100" placeholder="Top (1-100)" class="w-24 p-1.5 bg-white border rounded outline-none focus:ring-2 focus:ring-violet-500 text-center font-bold" value="${res.placement}" onchange="updatePlacement('${pId}', this.value)" /></td><td class="p-2 text-center"><input type="number" min="0" placeholder="0" class="w-20 p-1.5 bg-white border rounded outline-none focus:ring-2 focus:ring-red-500 text-center text-red-600 font-bold" value="${res.elims}" onchange="updateElims('${pId}', this.value)" /></td><td class="p-2 text-center"><input type="number" step="1" class="w-16 p-1.5 border border-slate-200 rounded text-center text-slate-600" value="${res.penalty||0}" onchange="updatePenalty('${pId}', this.value)" /></td><td class="p-3 text-right font-black text-xl text-violet-700">${calculateDraftPoints(pId)}</td><td class="p-2 text-center"><button onclick="removePlayerFromLobby('${pId}')" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button></td></tr>`;
            });
            return `<div class="bg-white rounded-xl shadow-lg border flex flex-col h-full max-h-full"><div class="bg-indigo-950 p-5 text-white flex justify-between items-center"><h3 class="text-xl font-bold"><i class="fa-solid fa-parachute-box text-yellow-400"></i> ${draft.name}</h3></div><div class="p-6 overflow-y-auto flex-1">${state.errorMsg ? `<div class="mb-4 p-3 bg-red-50 text-red-700 rounded-lg"><i class="fa-solid fa-triangle-exclamation"></i> ${state.errorMsg}</div>`:''}<div class="mb-6 bg-slate-50 p-4 rounded-lg flex gap-3"><div class="flex-1"><select id="lobby-player-select" class="w-full p-2 border rounded font-medium">${opts}</select></div><button onclick="addPlayerToLobby()" class="bg-indigo-900 text-white px-4 rounded font-bold hover:bg-indigo-800 transition">Ajouter</button><button onclick="addAllPlayersToLobby()" class="bg-violet-600 text-white px-4 rounded font-bold hover:bg-violet-500 transition" title="Ajouter tous les joueurs inscrits"><i class="fa-solid fa-users"></i> Tous</button></div><div class="overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="border-b"><th class="p-3 text-sm text-slate-500 uppercase">Joueur</th><th class="p-3 text-center text-sm text-slate-500 uppercase">Top (Position)</th><th class="p-3 text-center text-sm text-red-500 uppercase">Éliminations</th><th class="p-3 text-xs text-center text-slate-400 uppercase">Pénalités</th><th class="p-3 text-right text-violet-600 uppercase text-sm font-bold">Total Pts</th><th></th></tr></thead><tbody>${tb}</tbody></table></div></div><div class="bg-slate-50 p-4 border-t flex justify-between"><button onclick="deleteMatch('${draft.id}')" class="text-red-600 font-medium"><i class="fa-solid fa-trash"></i> Supprimer la partie</button><div class="flex gap-3"><button onclick="cancelEditMatch()" class="px-4 py-2 border rounded-lg font-medium text-slate-600 bg-white">Annuler</button><button onclick="saveMatch()" class="px-6 py-2 bg-violet-600 text-white rounded-lg font-bold shadow-md hover:bg-violet-500 transition">Enregistrer les scores</button></div></div></div>`;
        }

        function renderMatchesList() {
            if(state.matches.length===0) return `<p class="text-slate-500 text-center py-8 col-span-2">Aucune partie n'a été créée. Déployez le bus de combat !</p>`;
            return state.matches.map(m => {
                let pl = m.players.length===0 ? `<i>Vide</i>` : `<span class="text-sm font-bold text-violet-700">${m.players.length} Joueur(s) dans le bus</span>`;
                return `<div class="bg-white rounded-xl shadow-sm border p-5 flex flex-col hover:border-violet-300 transition-colors"><div class="flex justify-between mb-4"><div class="font-bold text-lg text-slate-800 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full ${m.status === 'completed' ? 'bg-green-500' : 'bg-yellow-500'}"></span> ${m.name}</div><button onclick="editMatch('${m.id}')" class="text-violet-700 bg-violet-50 px-3 py-1.5 rounded-md text-sm font-bold hover:bg-violet-100 transition">${m.status==='completed'?'Éditer':'Saisir scores'}</button></div><div class="flex flex-wrap gap-2">${pl}</div></div>`;
            }).join('');
        }

        function renderMatches() {
            return `<div class="p-8 max-w-6xl mx-auto overflow-y-auto h-full"><div class="flex justify-between items-center mb-8"><h2 class="text-3xl font-bold text-slate-800">Parties (Lobbys)</h2><div class="flex gap-3"><button onclick="autoGenerateLobbies()" class="bg-indigo-600 text-white px-4 py-2.5 rounded-lg font-bold hover:bg-indigo-500 transition"><i class="fa-solid fa-robot"></i> Remplissage Auto</button><button onclick="createMatch()" class="bg-violet-600 text-white px-4 py-2.5 rounded-lg font-bold shadow-md hover:bg-violet-500 transition"><i class="fa-solid fa-plus"></i> Nouvelle Partie</button></div></div><div class="flex-1 min-h-[400px]">${state.editingMatch ? renderMatchEditor() : `<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">${renderMatchesList()}</div>`}</div></div>`;
        }

        function renderPlayers() {
            let r = state.players.map(p => `<tr class="hover:bg-slate-50"><td class="p-4 font-bold text-slate-900">${p.pseudo}</td><td class="p-4 text-slate-600">${p.team||'-'}</td><td class="p-4 text-center"><button onclick="removePlayer('${p.id}')" class="text-red-500 bg-red-50 p-2 rounded hover:bg-red-100 transition"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('');
            if(!r) r = `<tr><td colspan="3" class="p-8 text-center text-slate-500">Aucun joueur inscrit.</td></tr>`;
            return `<div class="p-8 max-w-4xl mx-auto overflow-y-auto h-full"><h2 class="text-3xl font-bold mb-8 text-slate-800">Joueurs Inscrits</h2><form onsubmit="addPlayer(event)" class="mb-8 bg-white p-5 rounded-xl shadow-sm border flex gap-4"><input type="text" id="input-pseudo" required placeholder="Pseudo Epic Games" class="flex-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-violet-500 font-medium" /><input type="text" id="input-team" placeholder="Équipe / Clan" class="flex-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-violet-500 font-medium" /><button type="submit" class="bg-indigo-950 text-white px-6 py-2.5 rounded-lg font-bold hover:bg-indigo-800 transition">Ajouter</button></form><div class="bg-white rounded-xl shadow-sm border"><table class="w-full text-left"><thead><tr class="bg-slate-50 text-xs font-bold text-slate-500 uppercase tracking-wider"><th class="p-4">Joueur</th><th class="p-4">Équipe</th><th class="p-4 text-center">Action</th></tr></thead><tbody class="divide-y divide-slate-100">${r}</tbody></table></div></div>`;
        }

        function renderTVMode() {
            const st = getStandings();
            const cards = st.map((p, i) => {
                let bg = "fn-card-standard", rC = "text-[#28B1FF]";
                if (i===0) { bg = "fn-card-1st"; rC = "text-black"; }
                else if (i===1) { bg = "fn-card-2nd"; rC = "text-[#E2FF00]"; }
                else if (i===2) { bg = "fn-card-3rd"; rC = "text-white"; }
                return `
                <div class="fn-card ${bg} flex items-center justify-between p-3 md:p-5">
                    <div class="flex items-center gap-4 flex-1" style="transform: skewX(5deg);">
                        <span class="tv-rank w-12 md:w-20 text-center ${rC}">
                            ${i===0 ? '<i class="fa-solid fa-crown mr-1"></i>' : ''} ${i+1}
                        </span>
                        <div class="flex-1">
                            <h2 class="tv-name ${i===0?'text-black':'text-white'} ${i!==0?'fn-text-outline':''}">${p.pseudo}</h2>
                            <span class="tv-team ${i===0?'text-slate-800':'text-[#E2FF00]'} block mt-1">${p.team||'AGENT LIBRE'}</span>
                        </div>
                    </div>
                    <div class="flex items-end gap-6 text-right" style="transform: skewX(5deg);">
                        <div class="flex flex-col items-end hidden sm:flex">
                            <span class="text-sm uppercase font-bold ${i===0?'text-slate-700':'text-slate-300'}">Élims</span>
                            <span class="text-2xl font-bold ${i===0?'text-black':'text-white'}">${p.totalElims} <i class="fa-solid fa-skull ml-1 opacity-50"></i></span>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-sm uppercase font-bold ${i===0?'text-slate-800':'text-[#56CCF2]'}">Points</span>
                            <span class="tv-pts ${i===0?'text-black':'text-white'} ${i!==0?'fn-text-outline':''}">${p.totalPoints}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');

            return `
            <div class="fn-tv-mode h-full w-full flex flex-col relative">
                <div class="fn-bg"></div>
                <div class="fn-storm-effect"></div>
                
                ${!state.isTVWindow ? `<button onclick="setTab('dashboard')" class="absolute top-4 right-4 text-white z-50 bg-black/50 px-3 py-1 rounded-full border border-white/20 font-sans text-sm hover:bg-white hover:text-black transition">Fermer l'aperçu <i class="fa-solid fa-xmark"></i></button>` : ''}
                
                <header class="p-8 text-center z-10 relative shrink-0">
                    <!-- CORRECTION COULEUR TITRE : Utilisation de la classe fn-victory-glow pour une visibilité parfaite -->
                    <h1 class="fn-title-font uppercase fn-victory-glow" style="font-size: clamp(3rem, 6vw, 6rem); transform: skewX(-5deg);">VICTOIRE ROYALE</h1>
                    <p class="text-xl text-indigo-200 font-bold tracking-widest uppercase mt-2">Classement du Tournoi</p>
                </header>
                
                <div id="tv-scroll-container" class="flex-1 px-4 md:px-12 z-10 w-full max-w-7xl mx-auto overflow-y-auto hide-scroll pb-20">
                    <div class="w-full">${cards || `<p class="text-center text-white mt-10 text-3xl fn-title-font italic">En attente du largage...</p>`}</div>
                </div>
            </div>`;
        }

        function renderModals() {
            let html = '';
            if(state.confirmDialog.isOpen) {
                html += `<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4"><div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm"><h3 class="text-xl font-bold mb-2 text-slate-800">${state.confirmDialog.title}</h3><p class="mb-6 text-slate-600">${state.confirmDialog.message}</p><div class="flex justify-end gap-3"><button onclick="closeConfirm()" class="px-4 py-2 bg-slate-100 rounded-lg font-medium text-slate-700 hover:bg-slate-200 transition">Annuler</button><button onclick="executeConfirm()" class="px-4 py-2 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 transition">Confirmer</button></div></div></div>`;
            }
            if(state.promptDialog.isOpen) {
                html += `<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4"><div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm"><h3 class="text-xl font-bold mb-2 text-slate-800">${state.promptDialog.title}</h3><p class="mb-4 text-slate-600">${state.promptDialog.message}</p><input type="number" min="2" class="w-full p-2.5 mb-6 border rounded-lg text-center text-lg font-bold focus:ring-2 focus:ring-violet-500 outline-none" value="${state.promptDialog.value}" onkeyup="updatePromptValue(this.value)" /><div class="flex justify-end gap-3"><button onclick="closePrompt()" class="px-4 py-2 bg-slate-100 rounded-lg font-medium text-slate-700 hover:bg-slate-200 transition">Annuler</button><button onclick="executePrompt()" class="px-4 py-2 bg-violet-600 text-white rounded-lg font-bold hover:bg-violet-700 transition">Valider</button></div></div></div>`;
            }
            return html;
        }

        function render() {
            saveToStorage();
            if (state.isTVWindow) { document.getElementById('mobile-header').classList.add('hidden'); document.getElementById('app').innerHTML = renderTVMode(); return; }
            document.getElementById('mobile-header').classList.remove('hidden'); document.getElementById('mobile-menu-icon').className = `fa-solid ${state.mobileMenuOpen ? 'fa-xmark' : 'fa-bars'} text-2xl`;
            let content = '';
            if(state.activeTab === 'dashboard') content = renderDashboard();
            else if(state.activeTab === 'matches') content = renderMatches();
            else if(state.activeTab === 'players') content = renderPlayers();
            else if(state.activeTab === 'tv') content = renderTVMode();
            document.getElementById('app').innerHTML = `${renderSidebar()}<main class="flex-1 overflow-hidden relative bg-slate-50">${content}</main>${renderModals()}`;
        }
        render();
    </script>
</body>
</html>
